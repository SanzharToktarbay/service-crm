{% extends "base.html" %}

{% block title %}Вход — Service CRM{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Вход в CRM</h1>
  {% if form.errors %}
    <p class="error">Неверный логин или пароль</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Логин {{ form.username }}</label>
    <label>Пароль {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
{% endblock %}
